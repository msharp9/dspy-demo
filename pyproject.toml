[project]
name = "dspy-demo"
version = "0.1.0"
description = "A student-friendly introduction to DSPy: signatures, modules, optimizers, and saving programs."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=4",
    "dspy>=3.4.1",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
pythonpath = ["src"]
minversion = "6.0"
addopts = "--cov=src --cov-report=term-missing"
testpaths = [
    "tests",
]

[tool.coverage.report]
fail_under = 80
